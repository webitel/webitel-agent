name: Windows build
run-name: Windows build ${{ inputs.ref || github.ref_name }}

# Builds the unsigned Windows app (Release folder). Signing with the Certum EV
# cloud certificate needs an interactive SimplySign login (OTP from a phone),
# so MSI/MSIX packaging and signing run on a maintainer's machine with
# packaging/windows/package.sh. See packaging/windows/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or SHA to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        # MSVC 14.5x (VS 2026 on windows-latest) turns the experimental coroutine
        # deprecation into a hard error; flutter_inappwebview_windows still
        # includes those headers.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath webitel-desk-track-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webitel-desk-track-windows-x64
          path: webitel-desk-track-windows-x64.zip
          retention-days: 7
