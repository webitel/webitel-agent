name: Windows build
run-name: Windows build ${{ inputs.ref || github.ref_name }}

# Builds the unsigned Windows app (Release folder). Signing with the Certum EV
# cloud certificate needs an interactive SimplySign login (OTP from a phone),
# so MSI/MSIX packaging and signing run on a maintainer's machine with
# packaging/windows/package.sh. See packaging/windows/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or SHA to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        # MSVC 14.5x (VS 2026 on windows-latest) turns the experimental coroutine
        # deprecation into a hard error; flutter_inappwebview_windows still
        # includes those headers.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Bundle the VC++ runtime
        # The runner and the plugins link the C++ runtime dynamically (/MD). Windows
        # without the VC++ Redistributable has no MSVCP140.dll and the app does not
        # start, so the runtime ships next to the exe (app-local deployment).
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the C++ x64 tools found" }
          # The newest redist of the toolset that built the app; an older CRT than the build toolset is unsupported.
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object Name -match '^\d+\.\d+\.\d+$' |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $redist) { throw "no MSVC redist under $vs\VC\Redist\MSVC" }
          $crt = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "no x64 CRT folder in $($redist.FullName)" }
          $out = 'build/windows/x64/runner/Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) $out -ErrorAction Stop
          }
          "CRT from $($crt.FullName)"
          Get-ChildItem $out -Filter '*140*.dll' | Format-Table Name, Length, @{ n = 'Version'; e = { $_.VersionInfo.FileVersion } }

      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath webitel-desk-track-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webitel-desk-track-windows-x64
          path: webitel-desk-track-windows-x64.zip
          retention-days: 7
